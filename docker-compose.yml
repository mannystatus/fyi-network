version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fyi
      POSTGRES_PASSWORD: fyi
      POSTGRES_DB: fyi
    ports:
      - "5432:5432"
    volumes:
      - fyi_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fyi:fyi@db/fyi
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  fyi_db_data:
