name: Game-day push alerts

# Runs app/send_game_alerts.py on a schedule to push "starting soon" and
# "final score" Web Push alerts to fyiDodgers/fyiLakers subscribers. Every
# 15 min so a "game starts within the next hour" check has enough
# resolution to fire once per game without a large miss window.
#
# Requires the same DATABASE_URL secret as ingest-news.yml, plus:
#   - VAPID_PRIVATE_KEY / VAPID_PUBLIC_KEY   Web Push signing keypair
#   - VAPID_CLAIM_EMAIL                       contact email for the VAPID JWT claim
# The public key also needs to be set on the deployed backend (Vercel env
# vars) — that's what /api/push/public-key hands to browsers to subscribe
# against; this workflow only needs the private key to actually send.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m app.send_game_alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
