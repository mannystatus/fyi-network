name: Run backend script

# Manual trigger for one-off diagnostic/maintenance scripts against
# production — DATABASE_URL only exists as a secret here (and on Vercel),
# not locally. Mirrors the same pattern as ingest-news.yml/game-alerts.yml,
# just with the command left flexible instead of hardcoded.

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Command to run from the backend/ dir (e.g. python -m app.send_game_alerts)"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ${{ inputs.command }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_CLAIM_EMAIL: ${{ secrets.VAPID_CLAIM_EMAIL }}
