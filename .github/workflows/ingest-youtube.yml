name: Ingest YouTube travel guides

# Runs app/ingest_youtube.py so fyiFlyNow's "Travel Guides" topic keeps
# getting new articles adapted from its curated creator channels. Needs
# both DATABASE_URL and GEMINI_API_KEY repo secrets — without
# GEMINI_API_KEY the script exits cleanly, doing nothing.
#
# No `schedule:` trigger on purpose — confirmed by hand (2026-08-02) that
# YouTube blocks transcript requests from GitHub Actions' IP outright
# (RequestBlocked/IpBlocked, see ingest_youtube.py), so an automated run
# would just fail the same way every time. Re-add a schedule once a
# residential proxy is wired into ingest_youtube.py (see its README link
# on working around IP bans); until then, trigger manually below — that
# works today from a non-datacenter IP (confirmed the same day: 10/13
# channels succeeded from a residential connection before YouTube's
# volume-based block kicked in, so a manual run may need repeating a
# couple of times to get through all channels).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Only ingest this one channel handle (e.g. AbroadinJapan) — leave blank for all"
        required: false
      limit:
        description: "Max new videos per channel (default 1)"
        required: false
        default: "1"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m app.seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: >
          python -m app.ingest_youtube
          ${{ github.event.inputs.channel && format('--channel {0}', github.event.inputs.channel) || '' }}
          --limit ${{ github.event.inputs.limit || '1' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
