name: Ingest news

# Runs app/ingest_news.py on a schedule so each brand's feed keeps getting
# real, current articles for its topics without anyone doing it by hand.
# Requires a DATABASE_URL repo secret pointing at the same Postgres the
# deployed backend reads from (see backend/app/database.py) — without it,
# this job writes into a throwaway SQLite file that's discarded when the
# runner exits, which is harmless but pointless. Set the secret once the
# backend is deployed (Neon/Render/Fly/etc.).

on:
  schedule:
    - cron: "17 13 * * *" # daily at 13:17 UTC — offset from :00 since GitHub's most congested/delayed slot is the top of the hour
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Reseeds brand metadata (name/topics/etc.) before every ingest run so
      # editing app/seed.py — e.g. adding a topic — takes effect in
      # production on the next scheduled run, with no separate manual step.
      # Safe to rerun: existing rows are updated in place, nothing duplicated.
      - run: python -m app.seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python -m app.ingest_news --all-brands --per-topic 8
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
