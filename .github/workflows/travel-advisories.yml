name: Travel advisories ingest

# Runs app/ingest_travel_advisories.py on a schedule to refresh
# TravelAdvisory with current US State Dept (Level 3/4) and UK FCDO
# (advise against all/essential travel) entries for fyiFlyNow's advisory
# banner and /travel-advisories page. Every 6 hours — neither government
# source updates more often than that in practice.
#
# Requires the same DATABASE_URL secret as ingest-news.yml.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m app.ingest_travel_advisories
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
